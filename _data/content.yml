papers:
  bayesian:
    title: Explaining Bayesian Neural Networks
    authors: "<strong>Kirill Bykov</strong>, Marina M.-C. Höhne, Adelaida Creosteanu,
      Klaus-Robert Müller, Frederick Klauschen, Shinichi Nakajima, Marius Kloft"
    venue: TMLR
    year: 2021
    journal: Transactions on Machine Learning Research
    url: https://arxiv.org/abs/2108.10346
    logo: tmlr
    summary: A distribution of explanations reveals more than a single attribution map.
      We extend attribution methods to Bayesian neural networks to study uncertainty
      and variation in the evidence behind a prediction.
  noisegrad:
    title: NoiseGrad — Enhancing Explanations by Introducing Stochasticity to Model
      Weights
    authors: "<strong>Kirill Bykov</strong>, Anna Hedström, Shinichi Nakajima, Marina
      M.-C. Höhne"
    venue: AAAI
    year: 2022
    journal: Proceedings of the AAAI Conference on Artificial Intelligence 36 (6),
      6132-6140
    url: https://ojs.aaai.org/index.php/AAAI/article/view/20561
    logo: aaai
    code: https://github.com/understandable-machine-intelligence-lab/NoiseGrad
    summary: Adding noise to model weights can improve the explanations we extract.
      NoiseGrad uses this idea to enhance both local attribution maps and global
      feature visualizations with a simple, method-agnostic procedure.
    links:
    - label: Twitter thread
      url: https://x.com/anna_hedstroem/status/1406922210279886849
    - label: Article
      url: https://www.bifold.berlin/news-events/news/view/news-detail/shining-a-light-into-the-black-box-of-ai-systems
  invert:
    title: Labeling Neural Representations with Inverse Recognition
    authors: "<strong>Kirill Bykov</strong>, Laura Kopf, Shinichi Nakajima, Marius
      Kloft, Marina M.-C. Höhne"
    venue: NeurIPS
    year: 2023
    journal: Advances in Neural Information Processing Systems 36, 24804-24828
    url: https://arxiv.org/abs/2311.13594
    logo: neurips
    code: https://github.com/lapalap/invert
    summary: INVERT connects internal representations with interpretable concepts
      without requiring segmentation masks. The method makes concept discovery scalable
      while measuring conceptual alignment and statistical significance.
    links:
    - label: Twitter thread
      url: https://twitter.com/kirill_bykov/status/1729870541908213974
  dora:
    title: 'DORA: Exploring Outlier Representations in Deep Neural Networks'
    authors: "<strong>Kirill Bykov</strong>, Mayukh Deb, Dennis Grinwald, Klaus-Robert
      Müller, Marina M.-C. Höhne"
    venue: TMLR
    year: 2023
    journal: Transactions on Machine Learning Research
    url: https://arxiv.org/abs/2206.04530
    logo: tmlr
    code: https://github.com/lapalap/dora
    summary: Unusual representations can point to hidden artifacts in a model.
      With DORA, we find these outliers without a reference dataset and show how
      they expose spurious features in vision models.
    links:
    - label: Video
      url: https://youtu.be/k2tgN7YsjN8
  cosy:
    title: 'CoSy: Evaluating Textual Explanations of Neurons'
    authors: Laura Kopf, Philine Lou Bommer, Anna Hedström, Sebastian Lapuschkin,
      Marina M.-C. Höhne, <strong>Kirill Bykov</strong>
    venue: NeurIPS
    year: 2024
    journal: Advances in Neural Information Processing Systems 37
    url: https://arxiv.org/abs/2405.20331
    logo: neurips
    code: https://github.com/lkopf/cosy
    summary: CoSy tests whether a neuron’s textual explanation matches its behavior.
      We generate examples of the described concepts and use the neuron’s activation
      responses to evaluate explanation quality.
    links:
    - label: Twitter thread
      url: https://x.com/kirill_bykov/status/1797981371597803851
  prism:
    title: 'Capturing polysemanticity with PRISM: A multi-concept feature description
      framework'
    authors: Laura Kopf, Nils Feldhus, <strong>Kirill Bykov</strong>, Philine Lou
      Bommer, Anna Hedström, Marina M.-C. Höhne, Oliver Eberle
    venue: NeurIPS
    year: 2025
    journal: Advances in Neural Information Processing Systems 38, 82938-82974
    url: https://arxiv.org/abs/2506.15538
    logo: neurips
    code: https://github.com/lkopf/prism
    summary: PRISM captures the multiple concepts encoded by LLM features rather
      than compressing them into a single explanation. We evaluate these multi-concept
      descriptions to make explanation quality and polysemanticity measurable.
    links:
    - label: Twitter thread
      url: https://x.com/lkopf_ml/status/1935716619868688735
  teleconnections:
    title: 'Deep learning meets teleconnections: Improving S2S predictions for European
      winter weather'
    authors: Philine L. Bommer, Marlene Kretschmer, Fiona R. Spuler, <strong>Kirill
      Bykov</strong>, Marina M.-C. Höhne
    venue: 'ML: Earth'
    year: 2025
    journal: 'Machine Learning: Earth 1 (1), 015002'
    url: https://arxiv.org/abs/2504.07625
    logo: ml_earth
    summary: Climate teleconnections provide useful structure for subseasonal European
      weather forecasts. We incorporate these remote atmospheric signals into deep
      learning models to improve predictions and examine the physical drivers of
      weather regimes.
  watermarks:
    title: 'Mark My Words: Dangers of Watermarked Images in ImageNet'
    authors: "<strong>Kirill Bykov</strong>, Klaus-Robert Müller, Marina M.-C. Höhne"
    venue: Springer
    year: 2024
    journal: Communications in Computer and Information Science 1947, 426--434
    url: https://arxiv.org/abs/2303.05498
    logo: springer_nature
    code: https://github.com/lapalap/mark-my-words
    summary: ImageNet models can rely on watermarks as shortcuts across multiple
      classes. We locate the affected representations and show how targeted changes
      can reduce reliance on these misleading cues.
    links:
    - label: Twitter thread
      url: https://x.com/kirill_bykov/status/1711320377740210272
  diversity:
    title: Visualizing the Diversity of Representations Learned by Bayesian Neural
      Networks
    authors: Dennis Grinwald, <strong>Kirill Bykov</strong>, Shinichi Nakajima, Marina
      M.-C. Höhne
    venue: TMLR
    year: 2023
    journal: Transactions on Machine Learning Research
    url: https://arxiv.org/abs/2201.10859
    logo: tmlr
    summary: Bayesian neural networks learn different representations across posterior
      samples. We visualize and measure this diversity to study its relationship
      with predictive uncertainty.
  slingshots:
    title: Manipulating Feature Visualizations with Gradient Slingshots
    authors: Alexander Warnecke, Lukas Pirch, <strong>Kirill Bykov</strong>, Marina
      M.-C. Höhne, Dilyara Bareeva, Konrad Rieck, Klaus-Robert Müller
    venue: NeurIPS
    year: 2025
    journal: Advances in Neural Information Processing Systems 38, 166757--166794
    url: https://arxiv.org/abs/2401.06122
    logo: neurips
    code: https://github.com/dilyabareeva/grad-slingshot
    summary: Feature visualizations can be manipulated without substantially changing
      model performance. We demonstrate this vulnerability with Gradient Slingshots
      and evaluate a defense for more reliable model auditing.
    links:
    - label: Twitter thread
      url: https://x.com/di_lya/status/1749553403313672451
  fsca:
    title: Finding Spurious correlations with Function-Semantic Contrast Analysis
    authors: "<strong>Kirill Bykov</strong>, Laura Kopf, Marina M.-C. Höhne"
    venue: xAI
    year: 2023
    journal: World Conference on Explainable Artificial Intelligence, 549-572
    url: https://link.springer.com/chapter/10.1007/978-3-031-44067-0_28
    logo: springer_nature
    summary: Comparing functional and semantic relationships can uncover hidden
      shortcuts. Our Function-Semantic Contrast Analysis uses this contrast to support
      scalable bias discovery with less manual inspection.
  polylogue:
    title: Do LLMs Experience an Internal Polylogue? Investigating Reasoning through
      the Lens of Personas
    authors: Nils A. Herrmann, Leander Girrbach, <strong>Kirill Bykov</strong>, Zeynep
      Akata
    venue: arXiv
    year: 2026
    journal: arXiv preprint arXiv:2605.09159
    url: https://arxiv.org/abs/2605.09159
    logo: arxiv
    code: https://anonymous.4open.science/r/polylogue
    summary: We trace LLM reasoning through persona directions, using these
      interpretable signals to predict answer correctness and explore interventions
      during generation.
  user-model:
    title: User Model Extraction via Belief Self-Distillation
    authors: Ali Holmov, Yiran Huang, <strong>Kirill Bykov</strong>, Zeynep Akata
    venue: arXiv
    year: 2026
    journal: arXiv preprint arXiv:2609.31603
    url: https://arxiv.org/abs/2609.31603
    logo: arxiv
    summary: LLMs form a picture of the users they interact with. We propose Belief
      Self-Distillation, an approach for extracting and causally editing these internal
      user models. We show that changing inferred user intent alters refusal, even
      when the request stays fixed.
    code: https://github.com/holmov1/bsd-user-models
