    title: Do LLMs Experience an Internal Polylogue? Investigating Reasoning through
      the Lens of Personas
    authors: Nils A. Herrmann, Leander Girrbach, <strong>Kirill Bykov</strong>, Zeynep
      Akata
    venue: arXiv
    year: 2026
    journal: arXiv preprint arXiv:2605.09159
    url: https://arxiv.org/abs/2605.09159
    logo: arxiv
    code: https://anonymous.4open.science/r/polylogue
    featured_title: Internal Polylogue in LLM Reasoning
    summary: We track persona directions in hidden activations during LLM reasoning.
      These interpretable signals predict correctness comparably to low-dimensional
      activation baselines. Paragraph-conditioned steering improves accuracy in three
      of four tested models and degrades the fourth; robust reasoning-time intervention
      remains an open question.
